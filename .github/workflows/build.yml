name: build-jar

on:
  workflow_dispatch:
  push:
    paths:
      - '01-coder/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Unpack project package
        run: |
          mkdir -p build-src
          unzip -q 01-coder/3.5.0/project-3.5.0-clean.zip -d build-src
          ls -la build-src

      - name: Build
        working-directory: build-src
        run: gradle --no-daemon --console=plain build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: carnis-3.5.0-jar
          path: build-src/build/libs/*.jar
          if-no-files-found: error
