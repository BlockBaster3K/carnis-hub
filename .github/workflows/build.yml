name: build-jar

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Путь к zip-пакету проекта (пусто = последняя версия)'
        required: false
        default: ''
  push:
    # Пушим только ветки. Push ТЕГА сюда попадать не должен: шаг публикации
    # сам двигает тег `vX.Y.Z` — иначе каждый прогон запускал бы следующий.
    branches:
      - '**'
    paths:
      - '01-coder/**'
      - '04-artist/**'
      - '03-sound/**'
      - '06-build/overlay.txt'

permissions:
  contents: write

# Несколько агентов могут сдавать файлы подряд. Собираем только последнее
# состояние ветки: промежуточный прогон отменяется, раннеры не тратятся впустую.
concurrency:
  group: build-jar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Дерево репозитория: страж ПЕРВЫМ, до компиляции и до всего прочего.
      # Причина реальная: коммит 84f3a43 сделан из подкаталога, его дерево
      # содержало три файла и удаляло 7301 путь (пакет 3.7.3, tools/, доску).
      # Git не ошибся, история цела — а каждая роль после pull получала
      # «пакета нет». Страж ловит сигнатуру «корень — подкаталог», требует
      # 12 корневых каталогов и порог 1000 путей.
      - name: Repo tree guard
        run: python3 02-reviewer/tools/repo_tree_guard.py

      # Ревизор (R15): тесты звуковых проверок не запускались ни в CI, ни в
      # гейте — страж allowlist был добровольным, а fail-open в
      # heard_elsewhere жил незамеченным. Зависимостей у тестов нет.
      - name: Sound orphans unit tests
        run: |
          set -e
          python3 tools/sound_orphans_alias_test.py
          python3 tools/sound_orphans_allowlist_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⛔ КЭШ ОТКЛЮЧЁН 2026-11-27, прогон 46074966096.
      # Сборка упала не на коде: аннотации прогона —
      #   «Restore Gradle distribution 8.1.1 failed: Cache service responded with 400»
      #   «Failed to restore gradle-home-v1|Linux|build[...]: Error: Cache service responded with 400»
      # Кэш-сервис ответил 400, gradle-home распаковался неполным, и `gradle` в шаге
      # Build не запустился вовсе. Предыдущий прогон с ТЕМ ЖЕ кодом (46074376474)
      # дошёл до R14, то есть исходники компилировались — значит виноват кэш, а не
      # пакет. Кэш здесь даёт минуты, но ценой невоспроизводимых падений: при
      # неполном gradle-home ошибка выглядит как «сломался код».
      # cache-read-only/cache-disabled убирают восстановление, оставляя установку.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'
          cache-disabled: true

      - name: Resolve package
        id: pkg
        shell: bash
        env:
          INPUT_PKG: ${{ github.event.inputs.package }}
        run: |
          set -e
          PKG="${{ github.event.inputs.package }}"
          if [ -z "$PKG" ]; then
            # Каталог версии без ZIP — ещё не сдача (например заготовка 3.7.0,
            # в которой нет project-*-clean.zip). Такой каталог НЕ выбираем:
            # иначе сборка падает или, хуже, соберёт не тот пакет.
            DIR=""
            for CAND in $(ls -1d 01-coder/*/ 2>/dev/null | sed 's|01-coder/||; s|/$||' \
                          | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?(-R[0-9]*)?$' | sort -V -r); do
              if ls -1 "01-coder/$CAND"/project-*-clean.zip >/dev/null 2>&1; then
                # ⛔ Пакет без ВЕРДИКТА РЕВИЗОРА не становится релизом.
                # Инцидент 2026-11-25: заготовка 3.7.2 (отладочная, гейт давал
                # код 1) оказалась старшей версией с ZIP — и CI выпустил
                # релиз v3.7.2 из непринятого пакета. Отсутствие файла
                # вердикта здесь — это «не принято», а не «принято по умолчанию».
                # Вердикт ищем по номеру версии БЕЗ точек: у ролей встречаются
                # оба вида — reviewer_3.6.0_verdict.md и reviewer_371_verdict.md.
                VBASE="${CAND%%-R*}"
                VDIG=$(echo "$VBASE" | tr -d '.')
                # ⛔ НЕ через `ls ... | head -1`: Actions запускает bash с `-eo pipefail`,
                # и при отсутствии совпадений ls даёт exit 2, pipefail поднимает его,
                # а set -e валит шаг МОЛЧА — до проверки на пустоту. Это и валило CI.
                # ⛔ З-CИ-1: ТОЛЬКО точные имена, никаких подстановок. Раньше
                # `reviewer_*3.1.2*` находил reviewer_3120_delta_verdict.md (вердикт
                # про 3.12.0) — пакет без своего вердикта становился релизом.
                VERD2=""
                for F in "00-board/reports/reviewer_${VBASE}_verdict.md" \
                         "00-board/reports/reviewer_${VDIG}_verdict.md"; do
                  [ -f "$F" ] || continue
                  VERD2="$F"
                  break
                done
                # ⛔ З-CИ-3: файл без СОДЕРЖАНИЯ (заглушка из переводов строки
                # и пробелов) — это НЕ вердикт. `[ -s ]` такое пропускает:
                # файл с одним переводом строки не пуст по размеру, но пуст по смыслу.
                if [ -n "$VERD2" ]; then
                  if ! grep -qE '[^[:space:]]' "$VERD2" 2>/dev/null; then
                    echo "::error::вердикт $VERD2 пуст по содержанию — считать принятым нельзя"
                    exit 1
                  fi
                fi
                if [ -z "$VERD2" ]; then
                  echo "- ⛔ \`01-coder/$CAND\`: пакет есть, но вердикта Ревизора нет — пропускаю (не релиз)"
                  echo "- ⛔ \`01-coder/$CAND\`: пакет есть, но вердикта Ревизора нет — пропускаю (не релиз)" >> "$GITHUB_STEP_SUMMARY"
                  continue
                fi
                # ⛔ З-CИ-4 (найдено сухим прогоном tools/ci_resolver_dryrun.py):
                # прежний греп считал вердикт отрицательным по ЛЮБОМУ вхождению
                # слова в файле. Вердикты содержат ИСТОРИЮ сдач: у 3.7.3 строка 7
                # «`d19169b4...` — не принята», а решение на строке 11 «# ПРИНЯТО».
                # CI пропускал 3.7.3 и 3.7.2 и выпускал релиз из 3.7.1.
                # Теперь решение читает tools/verdict_decision.py: 0 — отказ,
                # 1 — принято, 2 — решения нет, 3 — файл не прочитан.
                RC_NEG=0
                python3 "${VERDICT_TOOL:-tools/verdict_decision.py}" "$VERD2" > /tmp/vdec.log 2>&1 || RC_NEG=$?
                echo "- вердикт: $(cat /tmp/vdec.log)"
                if [ "$RC_NEG" = "2" ] || [ "$RC_NEG" = "3" ]; then
                  echo "::error::вердикт $VERD2 не даёт решения (код $RC_NEG) — публиковать нельзя"
                  echo "$(cat /tmp/vdec.log)"
                  exit 1
                fi
                if [ "$RC_NEG" = "0" ]; then
                  echo "- ⛔ \`01-coder/$CAND\`: вердикт Ревизора отрицательный — пропускаю"
                  echo "- ⛔ \`01-coder/$CAND\`: вердикт Ревизора отрицательный — пропускаю" >> "$GITHUB_STEP_SUMMARY"
                  continue
                fi
                DIR="$CAND"
                echo "- ✅ Вердикт: \`$VERD2\` — версия $CAND принята"
                echo "- ✅ Вердикт: \`$VERD2\` — версия $CAND принята" >> "$GITHUB_STEP_SUMMARY"
                break
              fi
            done
            test -n "$DIR" || { echo "::error::Нет ни одного принятого пакета"; echo "--- диагностика ---"; echo "каталоги с версией:"; ls -1d 01-coder/*/ 2>/dev/null | sed "s|01-coder/||; s|/$||"; echo "каталоги с ZIP:"; ls -1d 01-coder/*/ 2>/dev/null | while read d; do ls "$d"project-*-clean.zip >/dev/null 2>&1 && echo "  $d"; done; echo "вердикты:"; ls -1 00-board/reports/ | grep -i verdict; echo "pwd=$(pwd)"; exit 1; }
            # Та же мина, что и с вердиктом.
            PKG=""
            for F in "01-coder/$DIR"/project-*-clean.zip; do
              [ -f "$F" ] || continue
              PKG="$F"
              break
            done
          fi
          test -n "$PKG" && test -f "$PKG" || { echo "::error::Пакет не найден: '$PKG'"; exit 1; }

          # ⛔ З-CИ-2: ручной запуск (workflow_dispatch) с путём в package тоже
          # обязан иметь вердикт. Раньше защита стояла только в ветке автопоиска,
          # и ручной прогон мог опубликовать любой пакет, обойдя её целиком.
          if [ -n "$INPUT_PKG" ]; then
            VD=$(basename "$(dirname "$PKG")")
            VB="${VD%%-R*}"
            VDG=$(echo "$VB" | tr -d '.')
            MANUAL_VERDICT=""
            for F in "00-board/reports/reviewer_${VB}_verdict.md" \
                     "00-board/reports/reviewer_${VDG}_verdict.md"; do
              [ -f "$F" ] || continue
              MANUAL_VERDICT="$F"
              break
            done
            if [ -z "$MANUAL_VERDICT" ]; then
              echo "::error::ручной запуск: у пакета $VD нет вердикта Ревизора — публиковать нельзя"
              exit 1
            fi
            if ! grep -qE '[^[:space:]]' "$MANUAL_VERDICT" 2>/dev/null; then
              echo "::error::ручной запуск: вердикт $MANUAL_VERDICT пуст по содержанию"
              exit 1
            fi
            RC_MAN=0
            python3 "${VERDICT_TOOL:-tools/verdict_decision.py}" "$MANUAL_VERDICT" > /tmp/vman.log 2>&1 || RC_MAN=$?
            if [ "$RC_MAN" = "2" ] || [ "$RC_MAN" = "3" ]; then
              echo "::error::ручной запуск: вердикт $MANUAL_VERDICT не даёт решения (код $RC_MAN)"
              cat /tmp/vman.log
              exit 1
            fi
            if [ "$RC_MAN" = "0" ]; then
              echo "::error::ручной запуск: вердикт $MANUAL_VERDICT отрицательный"
              exit 1
            fi
            echo "- ✅ Ручной запуск: вердикт \`$MANUAL_VERDICT\` найден (З-CИ-2)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "path=$PKG" >> "$GITHUB_OUTPUT"
          echo "- Пакет: \`$PKG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Unpack project package
        shell: bash
        run: |
          mkdir -p build-src
          unzip -q "${{ steps.pkg.outputs.path }}" -d build-src
          echo "- Файлов распаковано: $(find build-src -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Assert version
        shell: bash
        run: |
          set -e
          # Ожидаемая версия берётся из имени каталога пакета:
          # 01-coder/<версия>/project-<версия>-clean.zip  ->  <версия>.
          # Суффикс пересдачи (-R, -R2, -R5) отбрасывается: внутренний
          # mod_version пересдачи совпадает с базовой версией.
          # Так проверка работает для любой версии и не требует правки workflow.
          DIR=$(basename "$(dirname "${{ steps.pkg.outputs.path }}")")
          EXPECT="${DIR%%-R*}"
          V=$(grep -m1 '^mod_version=' build-src/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "- Ожидаемая версия (каталог пакета \`$DIR\`): \`$EXPECT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- mod_version в пакете: \`$V\`" >> "$GITHUB_STEP_SUMMARY"
          [ "$V" = "$EXPECT" ] || { echo "::error::ожидалась версия $EXPECT, в пакете '$V'"; exit 1; }

      # ⛔ 3.8.1 доходил до игрока и падал на старте клиента:
      #   GeckoLibException: Error loading animation file
      #   Caused by: JsonParseException: Invalid keyframe data - multiple
      #              starting keyframes?0.0
      # GeckoLib обходит ключевые кадры В ПОРЯДКЕ ЗАПИСИ В JSON и бросает
      # исключение, если кадр с временем 0 встретился не первым (а нечисловой
      # ключ читается как 0). Сборка при этом зелёная: javac анимации не
      # разбирает. Проверка ловит это ДО сборки, чтобы такой jar не вышел.
      - name: Animation keyframes (GeckoLib order)
        shell: bash
        run: |
          set -e
          python3 tools/animation_keyframe_check.py "${{ steps.pkg.outputs.path }}"

      - name: Overlay accepted drops
        shell: bash
        run: |
          set -e
          LIST=06-build/overlay.txt
          test -f "$LIST" || { echo "::error::нет списка $LIST"; exit 1; }
          : > /tmp/expect.txt
          n=0
          while IFS= read -r line; do
            line="${line%%#*}"
            [ -z "$(echo -n "$line" | tr -d '[:space:]')" ] && continue
            src="$(echo "${line%%->*}" | xargs)"
            rest="${line#*->}"
            dst="$(echo "${rest%%|*}" | xargs)"
            if [ "$rest" = "${rest#*|}" ]; then want=""; else want="$(echo "${rest#*|}" | xargs)"; fi
            test -f "$src" || { echo "::error::источник не найден: $src"; exit 1; }
            case "$want" in
              ""|*[!0-9a-fA-F]*) echo "::error::строка без sha256 (файл: $src)"; exit 1 ;;
            esac
            [ "${#want}" = "64" ] || { echo "::error::sha256 неверной длины: $want"; exit 1; }
            got="$(sha256sum "$src" | cut -d' ' -f1)"
            [ "$got" = "$want" ] || { echo "::error::хеш не совпал: $src (ждали $want, получили $got)"; exit 1; }
            mkdir -p "$(dirname "build-src/$dst")"
            cp "$src" "build-src/$dst"
            echo "${dst#src/main/resources/}" >> /tmp/expect.txt
            echo "| \`$src\` | \`$dst\` | \`${want:0:12}\` |" >> "$GITHUB_STEP_SUMMARY"
            n=$((n+1))
          done < "$LIST"
          echo "- Перекрыто файлов: **$n**" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        working-directory: build-src
        run: |
          set -o pipefail
          echo "- javac: $(javac -version 2>&1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- java:  $(java -version 2>&1 | head -1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- gradle: $(gradle --version 2>&1 | grep -E '^Gradle' | head -1)" >> "$GITHUB_STEP_SUMMARY"
          # Версии инструментов в summary и контекст ошибок в логе: при падении
          # нужно сразу видеть, чей это провал — компилятора, ForgeGradle или
          # самого вызова gradle.
          set +e
          gradle --no-daemon --console=plain --stacktrace build 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" != 0 ]; then
            echo "- ⛔ gradle вернул код $RC" >> "$GITHUB_STEP_SUMMARY"
            {
              echo '```'
              grep -E "error:|FAILURE:|Could not|Caused by|Unresolved|symbol:|location:" /tmp/build.log | head -60 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "--- первые ошибки компиляции ---"
            grep -E "error:|FAILURE:|Could not resolve|Caused by" /tmp/build.log | head -40 || true
            # Печатаем контекст ошибок В ЛОГ прогона: javac пишет ошибки
            # раньше предупреждений, поэтому tail бесполезен — берём строки
            # error:/symbol:/location: и ±8 строк вокруг каждой.
            echo "=== КОНТЕКСТ ОШИБОК ==="
            grep -n "error:" /tmp/build.log | cut -d: -f1 | while read ln; do
              sed -n "$((ln-3)),$((ln+10))p" /tmp/build.log
              echo "-----"
            done || true
            exit "$RC"
          fi
          echo "- ✅ gradle build: код 0" >> "$GITHUB_STEP_SUMMARY"

      # Сборка Gradle проставляет в jar текущее время: в MANIFEST.MF строку
      # Implementation-Timestamp и в заголовки zip метки времени записей.
      # Поэтому две сборки одного и того же пакета дают РАЗНЫЕ байты и разный
      # sha256 — хеш «плывёт» от прогона к прогону, и проверка по хешу становится
      # бессмысленной. Здесь обе нестабильности обнуляются: jar становится
      # побайтово воспроизводимым, хеш стабилен между прогонами.
      - name: Normalize jar for reproducibility
        shell: bash
        run: |
          set -e
          JAR=$(ls build-src/build/libs/*.jar | head -1)
          python3 - "$JAR" <<'PYEOF'
          import os, re, sys, zipfile
          path = sys.argv[1]
          tmp = path + ".norm"
          src = zipfile.ZipFile(path)
          with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as dst:
              for info in src.infolist():
                  data = src.read(info.filename)
                  if info.filename == "META-INF/MANIFEST.MF":
                      data = re.sub(rb"Implementation-Timestamp: [^\r\n]*",
                                    b"Implementation-Timestamp: 0", data)
                  zi = zipfile.ZipInfo(info.filename, date_time=(1980, 1, 1, 0, 0, 0))
                  zi.compress_type = info.compress_type
                  zi.external_attr = info.external_attr
                  zi.internal_attr = info.internal_attr
                  zi.create_system = info.create_system
                  dst.writestr(zi, data)
          src.close()
          os.replace(tmp, path)
          PYEOF
          echo "- **Jar нормализован:** метки времени записей и Implementation-Timestamp обнулены — сборка побайтово воспроизводима" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify overlay reached the jar
        shell: bash
        run: |
          set -e
          [ -f /tmp/expect.txt ] || { echo "- Перекрытий не было" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          JAR=$(ls build-src/build/libs/*.jar | head -1)
          unzip -Z1 "$JAR" > /tmp/jarlist.txt
          miss=0
          while IFS= read -r rel; do
            if ! grep -qx "$rel" /tmp/jarlist.txt; then
              echo "::error::в jar нет $rel"; miss=1
            fi
          done < /tmp/expect.txt
          [ "$miss" = "0" ] && echo "- Все перекрытые файлы внутри jar ✔" >> "$GITHUB_STEP_SUMMARY"
          exit $miss

      - name: Report jar version
        id: jar
        shell: bash
        run: |
          set -e
          JAR=$(ls build-src/build/libs/*.jar | head -1)
          echo "file=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "ver=$(grep -m1 '^mod_version=' build-src/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "- JAR: \`$(basename "$JAR")\`, $(stat -c%s "$JAR") Б" >> "$GITHUB_STEP_SUMMARY"
          unzip -p "$JAR" META-INF/mods.toml > /tmp/mods.toml
          echo '```toml' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'version|displayName' /tmp/mods.toml >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: carnis-jar
          path: build-src/build/libs/*.jar
          if-no-files-found: error

      - name: Commit jar into repository
        id: commitjar
        shell: bash
        run: |
          set -e
          JAR_NAME="${{ steps.jar.outputs.name }}"
          cp "${{ steps.jar.outputs.file }}" "/tmp/$JAR_NAME"
          # ⛔ R14 ИДЁТ ПОСЛЕ ЭТОГО ШАГА И ПАДАЛ «пакет не найден» (прогон
          # 46077358996). Причина: ниже делается `git checkout -B main`, рабочее
          # дерево становится main-овым, а пакет 3.8.1 живёт только в ветке
          # задачи — файла `01-coder/3.8.1/project-3.8.1-clean.zip` на диске уже
          # нет, и R14 получал пустой путь. Сохраняем пакет в /tmp ДО переключения
          # и отдаём его R14 через output. Сверка при этом не слабеет: это те же
          # байты принятого пакета, что распакованы в build-src.
          PKG_SRC="${{ steps.pkg.outputs.path }}"
          if [ -f "$PKG_SRC" ]; then
            cp "$PKG_SRC" /tmp/pkg_for_r14.zip
            echo "pkg=/tmp/pkg_for_r14.zip" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R14 не сможет сверить: пакет $PKG_SRC не найден до checkout"
            echo "pkg=" >> "$GITHUB_OUTPUT"
          fi
          # ⛔ ТО ЖЕ САМОЕ ДЛЯ САМОГО СКРИПТА R14 (прогон 46078136979).
          # После `git checkout -B main` на диске main-овое дерево, а
          # tools/release_jar_check.py в main НЕТ — он живёт только в ветке
          # задачи. Python падал с «can't open file», отдавал код 2, а шаг
          # трактует 2 как «JAR НЕ соответствует пакету». То есть проверка
          # не выполнялась вовсе, а вердикт был обвинительный — и релиз
          # блокировался на пустом месте. Сохраняем скрипт рядом с пакетом.
          if [ -f tools/release_jar_check.py ]; then
            cp tools/release_jar_check.py /tmp/release_jar_check.py
            echo "r14tool=/tmp/release_jar_check.py" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R14 не сможет сверить: tools/release_jar_check.py не найден до checkout"
            echo "r14tool=" >> "$GITHUB_OUTPUT"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git checkout -B main origin/main
          mkdir -p 06-build/jars
          # Jar нормализован, поэтому побайтовое сравнение корректно:
          # если содержимое то же — main не трогаем и релиз не перезаписываем.
          CHANGED=1
          if git cat-file -e "origin/main:06-build/jars/$JAR_NAME" 2>/dev/null; then
            git show "origin/main:06-build/jars/$JAR_NAME" > "/tmp/old_$JAR_NAME"
            if cmp -s "/tmp/$JAR_NAME" "/tmp/old_$JAR_NAME"; then
              CHANGED=0
              echo "jar не изменился (побайтово) — коммит не нужен"
            fi
          fi
          if [ "$CHANGED" = "1" ]; then
            cp "/tmp/$JAR_NAME" "06-build/jars/$JAR_NAME"
            git add "06-build/jars/$JAR_NAME"
            if git diff --cached --quiet; then
              echo "jar не изменился — коммит не нужен"
            else
              git commit -m "build: $JAR_NAME из ${{ steps.pkg.outputs.path }} (run ${{ github.run_id }})"
              # ⛔ ТИХАЯ ПРАВКА. Раньше здесь стоял цикл `git push ... && break`
              # без проверки результата: если все три попытки отклонены (нет
              # прав у GITHUB_TOKEN, защита ветки, гонка с другим агентом),
              # шаг всё равно завершался успехом. Дальше `commit=$(git rev-parse
              # HEAD)` отдавал локальный коммит, R14 сверял его — тоже успех
              # (файл-то на диске), а «Publish release» падал на проверке
              # «TARGET не в origin/main». Прогон 46150901060: все шаги
              # success, а тега v3.9.0 и релиза нет — сдачу нельзя было
              # проверить даже по логу, потому что причина тонула в тишине.
              # Теперь push обязан пройти, иначе шаг падает с внятным текстом.
              PUSHED=0
              for i in 1 2 3; do
                if git push origin main; then PUSHED=1; break; fi
                echo "::warning::push в main отклонён (попытка $i) — повтор"
                git pull --rebase --autostash origin main
              done
              if [ "$PUSHED" != "1" ]; then
                echo "::error::JAR собран и проверен, но push в main не прошёл за 3 попытки — релиз опубликовать нельзя. Причины: токен без contents:write, защита ветки main, или встречный push другого агента."
                exit 1
              fi
            fi
            echo "- **JAR в репозитории:** [06-build/jars/$JAR_NAME](https://github.com/${{ github.repository }}/blob/main/06-build/jars/$JAR_NAME)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **JAR в репозитории:** без изменений (содержимое совпадает с текущим в \`main\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Коммит, в котором физически лежит именно этот JAR. На него встанет тег.
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # R14: релиз обязан быть собран из ПРИНЯТЫХ байтов.
      #
      # Зачем. 3.7.3 был выпущен из аннулированного пакета: JAR отдан за ту же
      # версию, что принята, а внутри прежние звуки. Проверка сравнивает
      # ассеты `assets/carnis/**` в JAR с `src/main/resources/assets/carnis/**`
      # в ZIP по sha256. Код 2 — сборка НЕ выпускается.
      #
      # Ставится ПОСЛЕ Commit jar и ПЕРЕД Publish: до коммита проверять нечего
      # (jar ещё не там, откуда его возьмёт релиз), а после публикации
      # останавливать поздно — asset уже залит.
      # ---------------------------------------------------------------
      - name: Verify jar matches accepted package (R14)
        shell: bash
        env:
          # ⛔ Берём пакет, сохранённый в /tmp шагом «Commit jar into repository»
          # ДО `git checkout -B main`. Прежний env указывал на путь в ветке
          # задачи, которого после переключения на main на диске нет — R14 падал
          # с «пакет не найден» уже ПОСЛЕ успешной сборки и коммита jar.
          # Пусто → падаем явно, а не проверяем пустоту.
          PKG: ${{ steps.commitjar.outputs.pkg }}
          R14_TOOL: ${{ steps.commitjar.outputs.r14tool }}
          JAR_FILE: ${{ steps.jar.outputs.file }}
        run: |
          set -e
          if [ -z "$PKG" ]; then
            echo "::error::R14: пакет не передан шагом Commit jar — сверять нечем"
            exit 2
          fi
          echo "Проверка R14: JAR против принятого пакета"
          # ⛔ Печатаем ФАКТИЧЕСКИЕ байты, которые проверяем: путь сам по себе
          # ничего не доказывает, а локальный прогон того же скрипта на jar из
          # main и на принятом пакете даёт «654/654 ассетов совпали, 0 лишних
          # кроме датагена». Если CI снова упадёт — по sha256 будет видно, тот
          # ли это пакет и тот ли jar (прогон 46077692665 упал без цифр).
          echo "- JAR:  \`$JAR_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Пакет: \`$PKG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256(jar):   $(sha256sum "$JAR_FILE" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256(пакет): $(sha256sum "$PKG" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- упаковка jar:  $(unzip -Z1 "$JAR_FILE" | wc -l) записей" >> "$GITHUB_STEP_SUMMARY"
          # ⛔ Отчёт R14 уходит в ветку ci-log упавшего прогона.
          # Причина: `gh run view --log` в этой среде отдаёт EOF, а результат
          # R14 живёт только в GITHUB_STEP_SUMMARY, которую прочитать нечем —
          # прогон 46077692665 упал с RC=2 без единой цифры расхождения.
          # Локальный прогон того же скрипта на тех же файлах даёт 0, поэтому
          # без вывода CI дальше идти нельзя. Пушим только при падении.
          dump_r14() {
            {
              echo "=== R14 ==="
              echo "jar:   $JAR_FILE"
              echo "пакет: $PKG"
              echo "sha256(jar):   $(sha256sum "$JAR_FILE" 2>/dev/null | cut -d' ' -f1)"
              echo "sha256(пакет): $(sha256sum "$PKG" 2>/dev/null | cut -d' ' -f1)"
              echo "RC=$RC"
              echo "--- вывод release_jar_check.py ---"
              cat /tmp/r14.txt 2>/dev/null
            } > /tmp/r14_report.txt 2>&1
            git fetch --no-tags origin main >/dev/null 2>&1 || true
            BLOB=$(git hash-object -w /tmp/r14_report.txt 2>/dev/null) || exit 0
            git update-index --add --cacheinfo 100644,"$BLOB",06-build/r14_report.txt 2>/dev/null || exit 0
            TREE=$(git write-tree 2>/dev/null) || exit 0
            CMT=$(git commit-tree "$TREE" -p "$(git rev-parse HEAD)" \
                    -m "ci: отчёт R14 (run ${{ github.run_id }})" 2>/dev/null) || exit 0
            git push --force origin "$CMT:refs/heads/ci-log/${{ github.run_id }}" >/dev/null 2>&1 || true
            git reset --hard HEAD >/dev/null 2>&1 || true
          }
          if [ ! -f "$JAR_FILE" ]; then
            echo "::error::R14: JAR не найден: $JAR_FILE"
            exit 2
          fi
          if [ ! -f "$PKG" ]; then
            echo "::error::R14: пакет не найден: $PKG"
            exit 2
          fi
          if [ -z "$R14_TOOL" ] || [ ! -f "$R14_TOOL" ]; then
            echo "::error::R14: скрипт проверки не сохранён — сверять нечем"
            exit 2
          fi
          PY=$(command -v python3 || command -v python)
          set +e
          "$PY" "$R14_TOOL" --jar "$JAR_FILE" --pkg "$PKG" \
            > /tmp/r14.txt 2>&1
          RC=$?
          set -e
          cat /tmp/r14.txt
          {
            echo '```'
            cat /tmp/r14.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" = "0" ]; then
            echo "- ✅ R14: JAR собран из принятого пакета" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RC" = "2" ]; then
            echo "::error::R14: JAR НЕ соответствует принятому пакету — релиз не выпускается"
            echo "- ❌ R14: расхождения, релиз остановлен" >> "$GITHUB_STEP_SUMMARY"
            dump_r14
            exit 2
          fi
          # код 1 = проверка не смогла выполниться (нет файла, пустой вход),
          # это НЕ доказательство расхождения — сообщение должно отличаться,
          # иначе «не смогли проверить» маскируется под «проверили и плохо».
          dump_r14
          echo "::error::R14: проверка не выполнена (код $RC) — релиз не выпускается"
          exit 2

      - name: Publish release with jar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${{ steps.jar.outputs.ver }}"
          JAR_NAME="${{ steps.jar.outputs.name }}"
          TARGET="${{ steps.commitjar.outputs.commit }}"

          # Тег обязан указывать на коммит, СОДЕРЖАЩИЙ этот JAR.
          # Раньше шаг шёл до коммита JAR в main и тег вставал на предыдущий
          # коммит: релиз ссылался на сборку, которой в нём не было.
          git fetch --no-tags origin main
          # Диагностика в ветку ci-log: по логам прогона этот отказ читать
          # нечем (gh run view --log отдаёт EOF в этой среде), поэтому
          # состояние пишется туда, откуда его можно забрать.
          dump_publish_fail() {
            {
              echo "=== Publish release: отказ ==="
              echo "TAG=$TAG"
              echo "TARGET=$TARGET"
              echo "origin/main=$(git rev-parse origin/main)"
              echo "исходная ветка: $GITHUB_REF_NAME"
              echo "--- есть ли коммит в origin/main ---"
              git merge-base --is-ancestor "$TARGET" origin/main && echo "да" || echo "НЕТ"
              echo "--- есть ли jar в коммите ---"
              git cat-file -e "$TARGET:06-build/jars/$JAR_NAME" && echo "да" || echo "НЕТ"
              echo "--- ветки, содержащие TARGET ---"
              git branch -r --contains "$TARGET" 2>/dev/null || echo "нет"
            } > /tmp/publish_report.txt 2>&1
            BLOB=$(git hash-object -w /tmp/publish_report.txt 2>/dev/null) || exit 0
            git update-index --add --cacheinfo 100644,"$BLOB",06-build/publish_report.txt 2>/dev/null || exit 0
            TREE=$(git write-tree 2>/dev/null) || exit 0
            CMT=$(git commit-tree "$TREE" -p "$(git rev-parse HEAD)" \
                    -m "ci: отчёт публикации (run ${{ github.run_id }})" 2>/dev/null) || exit 0
            git push --force origin "$CMT:refs/heads/ci-log/${{ github.run_id }}-publish" >/dev/null 2>&1 || true
            git reset --hard HEAD >/dev/null 2>&1 || true
          }
          git merge-base --is-ancestor "$TARGET" origin/main || {
            dump_publish_fail
            echo "::error::коммит $TARGET не в origin/main — тег ставить нельзя"; exit 1; }
          git cat-file -e "$TARGET:06-build/jars/$JAR_NAME" || {
            echo "::error::в коммите $TARGET нет 06-build/jars/$JAR_NAME — тег ставить нельзя"; exit 1; }

          git tag -f "$TAG" "$TARGET"
          git push --force origin "refs/tags/$TAG"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag \
              --title "Carnis ${{ steps.jar.outputs.ver }}" \
              --notes "Автосборка модового jar. Файл обновляется при каждом прогоне из актуального пакета."
          fi
          gh release upload "$TAG" "${{ steps.jar.outputs.file }}" --clobber

          # Самопроверка: тег действительно на нужном коммите.
          NOW="$(git rev-parse "refs/tags/$TAG")"
          [ "$NOW" = "$TARGET" ] || { echo "::error::тег $TAG указывает на $NOW, ожидался $TARGET"; exit 1; }
          echo "- **Релиз:** [ $TAG ](https://github.com/${{ github.repository }}/releases/tag/$TAG) → коммит \`${TARGET:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Прямая ссылка на jar (через Azure, может не открываться):** https://github.com/${{ github.repository }}/releases/download/$TAG/$JAR_NAME" >> "$GITHUB_STEP_SUMMARY"
